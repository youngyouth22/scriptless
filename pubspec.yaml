name: scriptless
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  app_links: ^7.2.1
  dartz: ^0.10.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^18.0.2
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  pinput: ^6.0.2
  powersync: ^2.3.3
  purchases_flutter: ^10.9.1
  purchases_ui_flutter: ^10.9.1
  shared_preferences: ^2.3.2
  smooth_page_indicator: ^2.0.1
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  change_app_package_name: ^1.4.0
  flutter_flavorizr: ^2.6.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/
    - .env
    - .env.dev
    - .env.staging
    - .env.prod
