name: scriptless
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  app_links: ^7.2.1
  dartz: ^0.10.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.8
  get_it: ^9.2.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  powersync: ^2.3.3
  purchases_flutter: ^10.9.0
  purchases_ui_flutter: ^10.9.0
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0
  very_good_analysis: ^10.3.0
  change_app_package_name: ^1.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
